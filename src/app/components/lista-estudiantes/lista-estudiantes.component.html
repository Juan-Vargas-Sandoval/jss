<div class="card shadow-sm border-0">
  <div class="card-header bg-white border-bottom">
    <h5 class="mb-0 text-primary">
      <i class="bi bi-people-fill me-2"></i>Listado de Estudiantes
    </h5>
  </div>

  <div class="card-body">
    <div *ngIf="cargando" class="text-center py-4">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 mb-0 text-muted">Cargando estudiantes...</p>
    </div>

    <div *ngIf="error" class="alert alert-danger" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
    </div>

    <div class="table-responsive" *ngIf="!cargando && !error">
      <table class="table table-striped table-hover align-middle mb-0">
        <thead class="table-primary">
          <tr>
            <th scope="col">#</th>
            <th scope="col">Nombre</th>
            <th scope="col" class="text-center">Nota 1</th>
            <th scope="col" class="text-center">Nota 2</th>
            <th scope="col" class="text-center">Nota 3</th>
            <th scope="col" class="text-center">Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let e of estudiantes; let i = index">
            <td>{{ i + 1 }}</td>
            <td class="fw-semibold">{{ e.nombre }}</td>
            <td class="text-center">{{ e.nota1 }}</td>
            <td class="text-center">{{ e.nota2 }}</td>
            <td class="text-center">{{ e.nota3 }}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-success" (click)="verDetalle(e.id)">
                <i class="bi bi-eye-fill me-1"></i>Detalle
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
